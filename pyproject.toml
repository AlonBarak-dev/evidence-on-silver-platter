[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stopbrowse"
version = "0.1.0"
description = "initial_gold_injection experiment: thin adapter around FigBrowse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    # Reuse FigBrowse's agent loop, data loaders, retrieval, model client,
    # caching, grading, and run-dir conventions directly rather than
    # duplicating them.
    "figbrowse @ file:///Users/alonbarak/Documents/Thesis/FigBrowse",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
