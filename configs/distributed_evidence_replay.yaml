experiment_name: distributed_evidence_replay
seed: 42
sample_limit: 100

figbrowse_path: ../FigBrowse

model:
  name: USE_EXISTING_FIGBROWSE_DEFAULT
  temperature: 0

source:
  runs_path: outputs/initial_gold_injection_confirmatory_no_injection/runs.jsonl
  injection_position: no_injection
  document_view_tokens: 4096

replay:
  placement_seeds: [43]
  prefer_evidence_documents: true
  fallback_to_gold_documents: true

benchmark:
  name: browsecomp_plus
  questions_path: ../BrowseComp-Plus/topics-qrels/queries.tsv
  corpus_path: ../BrowseComp-Plus/data/browsecomp_plus_corpus
  evidence_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_evidence.txt
  gold_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_golds.txt
  answers_path: ../BrowseComp-Plus/data/browsecomp_plus_decrypted.jsonl

# Must match the retriever settings used to produce the source no_injection
# run — search-result reconstruction depends on hitting the same cache keys.
retriever:
  id: qwen3-4b
  type: qwen3_dense
  index_path: indexes/qwen3-embedding-4b
  query_encoder: Qwen/Qwen3-Embedding-4B
  task_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
  normalize: true
  pooling: eos
  top_k: 5
  preview_tokens: 512

output_dir: outputs/distributed_evidence_replay
resume: true
