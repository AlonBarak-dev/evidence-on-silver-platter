experiment_name: initial_gold_injection_confirmatory_full_evidence_reader
dataset: browsecomp_plus
split: confirmatory
sample_limit: 100
seed: 42

figbrowse_path: ../FigBrowse

model:
  name: USE_EXISTING_FIGBROWSE_DEFAULT
  temperature: 0

agent:
  max_post_injection_actions: 8
  enable_search: true
  enable_get_document: true

injection:
  prefer_evidence_documents: true
  fallback_to_gold_documents: true
  # Same document set/order as condition B (beginning), same seed — the
  # only thing that changes is that the reader gets full text immediately
  # (forced true in code for this position) instead of a preview.
  shuffle_documents: true
  expose_full_text_immediately: false
  positions: [full_evidence_reader]

benchmark:
  name: browsecomp_plus
  questions_path: ../BrowseComp-Plus/topics-qrels/queries.tsv
  corpus_path: ../BrowseComp-Plus/data/browsecomp_plus_corpus
  evidence_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_evidence.txt
  gold_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_golds.txt
  answers_path: ../BrowseComp-Plus/data/browsecomp_plus_decrypted.jsonl

retriever:
  id: qwen3-4b
  type: qwen3_dense
  index_path: indexes/qwen3-embedding-4b
  query_encoder: Qwen/Qwen3-Embedding-4B
  task_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
  normalize: true
  pooling: eos
  top_k: 5
  preview_tokens: 512

output_dir: outputs/initial_gold_injection_confirmatory_full_evidence_reader
resume: true
