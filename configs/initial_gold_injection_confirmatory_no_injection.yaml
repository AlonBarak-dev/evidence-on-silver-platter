experiment_name: initial_gold_injection_confirmatory_no_injection
dataset: browsecomp_plus
split: confirmatory
sample_limit: 100
seed: 42

figbrowse_path: ../FigBrowse

model:
  name: USE_EXISTING_FIGBROWSE_DEFAULT
  temperature: 0

agent:
  # Not used by the no_injection position (it has its own budget below),
  # kept for schema completeness / consistency with the other configs.
  max_post_injection_actions: 8
  enable_search: true
  enable_get_document: true

injection:
  # Same agent, same 100 confirmatory queries, but zero synthetic evidence —
  # a pure baseline run of FigBrowse's own unmodified search loop, with a
  # 10-action ceiling (search + get_document combined, matching FigBrowse's
  # own max_search_calls convention).
  positions: [no_injection]
  no_injection_max_actions: 10

benchmark:
  name: browsecomp_plus
  questions_path: ../BrowseComp-Plus/topics-qrels/queries.tsv
  corpus_path: ../BrowseComp-Plus/data/browsecomp_plus_corpus
  evidence_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_evidence.txt
  gold_qrels_path: ../BrowseComp-Plus/topics-qrels/qrel_golds.txt
  answers_path: ../BrowseComp-Plus/data/browsecomp_plus_decrypted.jsonl

retriever:
  id: qwen3-4b
  type: qwen3_dense
  index_path: indexes/qwen3-embedding-4b
  query_encoder: Qwen/Qwen3-Embedding-4B
  task_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
  normalize: true
  pooling: eos
  top_k: 5
  preview_tokens: 512

output_dir: outputs/initial_gold_injection_confirmatory_no_injection
resume: true
